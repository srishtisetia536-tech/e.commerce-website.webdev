<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<h1>🛒 Your Cart</h1>
<a href="/">← Back</a>

{% if items %}
    {% for item in items %}
        <div class="card">
            <h3>{{ item[1] }}</h3>
            <p>₹ {{ item[2] }}</p>
        </div>
    {% endfor %}

    <h2>Total: ₹ {{ total }}</h2>

    <a href="/checkout">
        <button>Checkout</button>
    </a>
{% else %}
    <p>Your cart is empty 😢</p>
{% endif %}

</body>
</html>
